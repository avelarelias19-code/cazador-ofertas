# IMPORTANTE: los CPs van ENTRE COMILLAS
postal_codes:
  - "06600"   # CDMX Centro (Juárez / Cuauhtémoc)
  - "09000"   # CDMX Oriente (Iztapalapa Centro)
  - "04500"   # CDMX Sur (Pedregal / Coyoacán)
  - "72000"   # Puebla, Pue. (Centro)
  - "76000"   # Santiago de Querétaro, Qro. (Centro)

rules:
  min_discount_pct: 49.99              # alerta desde 50% de descuento en productos < $10,000 MXN
  high_ticket_min_price: 10000         # en productos de rango >= $10,000 MXN...
  high_ticket_min_discount_pct: 30     # ...alerta desde 30% de descuento
  price_error_ratio: 0.35              # error de precio si precio <= 35% de la mediana histórica
  min_history_samples: 3
  symbolic_price_max: 10               # "precio simbólico": <= $10 ...
  symbolic_list_min: 500               # ... con precio de lista >= $500

monitor:
  day_interval_minutes: 10             # de 06:00 a 23:00 hrs (6 AM a 11 PM) revisa cada 10 minutos
  night_interval_minutes: 20           # de 23:00 a 06:00 hrs (11 PM a 6 AM) revisa cada 20 minutos
  day_start_hour: 6
  day_end_hour: 23
  queries_per_run: 20                  # búsquedas por corrida (rotan): con ~70 búsquedas se cubren todas cada ~40 min
  min_delay_seconds: 4                 # pausa entre productos de la misma tienda
  block_backoff_minutes: 60            # pausa si una tienda muestra CAPTCHA/bloqueo
  block_notice_cooldown_hours: 24      # máximo 1 aviso de bloqueo por tienda cada 24 h
  db_path: ofertas.db
  headless: true

# ---------------------------------------------------------------------------
# VUELOS (Multi-portal Web en México + Travelpayouts opcional).
# Revisa directamente: Viajes Suburbia, Viajes Liverpool, Despegar, BestDay,
# PriceTravel, Volaris, Viva Aerobus y Aeroméxico (NO requiere token para portales web).
# Códigos: MEX = CDMX, PBC = Puebla, QRO = Querétaro. destination: cualquiera = a donde sea.
# trip: redondo | sencillo | ambos
# ---------------------------------------------------------------------------
flights:
  enabled: true
  months_ahead: 3                      # busca salidas este mes y los 2 siguientes
  min_drop_pct: 50                     # alerta si está 50% abajo del precio normal de la ruta
  error_fare_drop_pct: 70              # "POSIBLE ERROR DE TARIFA" si está 70% abajo
  national_max_price_oneway: 700       # cualquier vuelo nacional sencillo <= $700 MXN
  national_max_price_roundtrip: 1400   # cualquier vuelo nacional redondo <= $1,400 MXN
  every_minutes: 60                    # revisa vuelos cada 60 minutos
  portals:
    - viajes_suburbia                  # https://viajes.suburbia.com.mx/vuelos/
    - viajes_liverpool                 # https://viajes.liverpool.com.mx/vuelos
    - despegar                         # https://www.despegar.com.mx/vuelos/
    - bestday                          # https://www.bestday.com.mx/vuelos/
    - pricetravel                      # https://www.pricetravel.com.mx/vuelos
    - volaris                          # https://www.volaris.com/es/ofertas-de-vuelos
    - vivaaerobus                      # https://www.vivaaerobus.com/es-mx/promociones/ofertas-de-vuelos
    - aeromexico                       # https://www.aeromexico.com/es-mx/promociones/vuelos
  routes:
    - { origin: MEX, destination: cualquiera, trip: ambos }
    - { origin: PBC, destination: cualquiera, trip: redondo }
    - { origin: QRO, destination: cualquiera, trip: redondo }
    - { origin: MEX, destination: CUN, trip: redondo }
    - { origin: MEX, destination: SJD, trip: redondo }
    - { origin: MEX, destination: MAD, trip: redondo }
    - { origin: MEX, destination: NYC, trip: redondo }
    - { origin: MEX, destination: LAX, trip: redondo }
    - { origin: MEX, destination: TYO, trip: redondo }
    # Ejemplo con tope propio: avisa siempre que MEX-BCN redondo baje de $9,000
    - { origin: MEX, destination: BCN, trip: redondo, max_price: 9000 }

