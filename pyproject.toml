[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ofertas-monitor"
version = "0.1.0"
description = "Monitor de ofertas extremas (>65% o errores de precio) en tiendas de México con alertas a Telegram."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ofertas-monitor = "ofertas_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: pruebas contra sitios reales (requieren red y --run-live)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

