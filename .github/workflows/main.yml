name: Cazador de Ofertas 24/7 (Sin PC prendida)

on:
  schedule:
    # De 06:00 a 22:59 hora CDMX (12:00 a 04:59 UTC): cada 10 minutos
    - cron: "*/10 0-4,12-23 * * *"
    # De 23:00 a 05:59 hora CDMX (05:00 a 11:59 UTC): cada 20 minutos
    - cron: "*/20 5-11 * * *"
  workflow_dispatch:

jobs:
  monitorear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Instalar dependencias y navegador Chromium
        run: |
          if [ -f "subir_a_github/requirements.txt" ]; then cd subir_a_github; fi
          pip install -r requirements.txt
          pip install -e .
          playwright install --with-deps chromium

      - name: Restaurar base de datos de historial y alertas (caché)
        uses: actions/cache@v4
        with:
          path: |
            ofertas.db
            subir_a_github/ofertas.db
          key: ofertas-db-${{ github.run_id }}
          restore-keys: |
            ofertas-db-

      - name: Ejecutar pasada del Cazador de Ofertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
        run: |
          if [ -f "subir_a_github/config.yaml" ]; then cd subir_a_github; fi
          python -m ofertas_monitor -c config.yaml --once
